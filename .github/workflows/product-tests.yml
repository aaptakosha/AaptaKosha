name: Product, Phase 2, 3, and 4 tests

on:
  workflow_dispatch:
  push:
    paths:
      - "src/aaptakosha_core/**"
      - "tests/test_phase2_*.py"
      - "tests/test_phase3_*.py"
      - "tests/test_phase4_*.py"
      - "tests/test_phase6_*.py"
      - "tests/test_phase7_*.py"
      - "migrations/**"
      - "pyproject.toml"
      - ".github/workflows/product-tests.yml"
  pull_request:
    paths:
      - "src/aaptakosha_core/**"
      - "tests/test_phase2_*.py"
      - "tests/test_phase3_*.py"
      - "tests/test_phase4_*.py"
      - "tests/test_phase6_*.py"
      - "tests/test_phase7_*.py"
      - "migrations/**"
      - "pyproject.toml"
      - ".github/workflows/product-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_phase2_*.py tests/test_phase3_*.py tests/test_phase4_*.py tests/test_phase6_*.py tests/test_phase7_*.py
