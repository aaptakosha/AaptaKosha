name: Content preservation guard

on:
  pull_request:
    paths:
      - "content/**"
      - "migrations/**"
      - "api/**"
      - "src/**"
      - "frontend/**"
  push:
    branches: ["main"]
    paths:
      - "content/**"
      - "migrations/**"
      - "api/**"
      - "src/**"

jobs:
  preserve-existing-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block deletion or rename of published content
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [[ "$BASE" =~ ^0+$ ]]; then
            exit 0
          fi

          bad="$(git diff --name-status "$BASE" "$HEAD" -- content/ | awk '$1 ~ /^(D|R|C)/ {print}')"
          if [[ -n "$bad" ]]; then
            echo "Published content is append-only. Deletion/rename/copy changes are blocked:"
            echo "$bad"
            exit 1
          fi

      - name: Block destructive curriculum SQL in changed migrations
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [[ "$BASE" =~ ^0+$ ]]; then
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$HEAD" -- migrations/)"
          if [[ -z "$changed" ]]; then
            echo "No migration files changed."
            exit 0
          fi
          for file in $changed; do
            if grep -niE '(^|[^-])(DROP[[:space:]]+TABLE|DELETE[[:space:]]+FROM|TRUNCATE[[:space:]]+TABLE|REPLACE[[:space:]]+INTO)' "$file"; then
              echo "Destructive SQL is not allowed in changed curriculum migrations."
              exit 1
            fi
          done

      - name: Enforce Padartha universal content contract
        run: |
          python -m pip install --quiet pytest
          pytest -q tests/test_content_contract_padartha.py

      - name: Enforce semantic preservation of existing content
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [[ "$BASE" =~ ^0+$ ]]; then
            echo "No previous revision available; skipping preservation comparison."
            exit 0
          fi
          rm -rf /tmp/aaptakosha-base
          mkdir -p /tmp/aaptakosha-base
          git archive "$BASE" content | tar -x -C /tmp/aaptakosha-base
          PYTHONPATH=src python -c "from aaptakosha_core.content_preservation import assert_content_preserved; assert_content_preserved('/tmp/aaptakosha-base', '.')"
      - name: Check repository content paths
        run: |
          test -d content
          test -d migrations
          echo "Content preservation guard passed."
