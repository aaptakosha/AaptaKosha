name: Samhita Library Autopilot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "content/samhita-registry.json"
      - "content/samhita/**"
      - "scripts/samhita_autopilot.py"
      - "scripts/samhita_source_ingest.py"
      - "scripts/samhita_sushruta_ingest.py"
      - "scripts/samhita_commentary_ingest.py"

permissions:
  contents: write

concurrency:
  group: samhita-autopilot
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run autonomous source acquisition
        run: python scripts/samhita_source_ingest.py --discover --limit 3

      - name: Ingest verified Sushruta primary text chapters
        run: python scripts/samhita_sushruta_ingest.py --max-chapters 46

      - name: Stage explicitly identified historical Tika
        run: python scripts/samhita_commentary_ingest.py --limit 100

      - name: Run autonomous library reconciliation
        run: python scripts/samhita_autopilot.py --write-state

      - name: Enforce additive-only state
        shell: bash
        run: |
          if git diff --name-status -- content/ | grep -E '(^|\s)(D|R|C)\s'; then
            echo "Autopilot attempted a destructive content change."
            exit 1
          fi

      - name: Commit automation state and source queue
        shell: bash
        run: |
          git config user.name "AaptaKosha Autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/.automation/samhita-autopilot-state.json content/.automation/source-verification-queue.json content/.automation/source-catalog.json content/.automation/tika-verification-queue.json
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "chore: reconcile Samhita library automation state"
          git push
