name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Check frontend JavaScript syntax
        run: node --check frontend/samhita.js && node --check frontend/samhita-detail.js
      - name: Run test suite
        run: PYTHONPATH=. pytest -q
