name: Sarangadhara source transfer
on:
  push:
    paths:
      - ".github/workflows/sarangadhara-source-transfer.yml"
      - "scripts/sarangadhara_source_transfer.py"
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transfer controlled digital witnesses
        run: python3 scripts/sarangadhara_source_transfer.py
      - name: Commit chapter transfers one-by-one
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "AaptaKosha Source Transfer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chapters=(
            content/samhita/sarangadhara/purva/chapter-06-aharaadigati/chapter.json
            content/samhita/sarangadhara/purva/chapter-07-rogaganana/chapter.json
            content/samhita/sarangadhara/madhyama/chapter-02-kvathakalpana/chapter.json
            content/samhita/sarangadhara/madhyama/chapter-06-churnakalpana/chapter.json
            content/samhita/sarangadhara/madhyama/chapter-09-ghrtatailakalpana/chapter.json
            content/samhita/sarangadhara/madhyama/chapter-10-asavarishtakalpana/chapter.json
            content/samhita/sarangadhara/madhyama/chapter-12-rasadishodhanamaranakalpana/chapter.json
            content/samhita/sarangadhara/uttara/chapter-01-snehapanavidhi/chapter.json
            content/samhita/sarangadhara/uttara/chapter-03-vamanavidhi/chapter.json
            content/samhita/sarangadhara/uttara/chapter-11-lepamurdhatailakarnapuranavidhi/chapter.json
            content/samhita/sarangadhara/uttara/chapter-13-netraprasadanavidhi/chapter.json
          )
          for f in "${chapters[@]}"; do
            git add "$f"
            if ! git diff --cached --quiet; then
              git commit -m "refine: transfer Sarangadhara $(basename "$(dirname "$(dirname "$f")")") digital witness"
            fi
          done
          git push
