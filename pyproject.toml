[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaptakosha-ingestion"
version = "0.2.0"
description = "AaptaKosha ingestion and product-domain foundation"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "clerk-backend-api>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "api.assessments:handler"
